[package]
name = "smol-push"
version = "0.3.1"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "tracing", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
console-subscriber = "0.5.0"
tracing-chrome = "0.7"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate"] }
hyper = { version = "1", features = ["http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3.32"
tokio-rustls = "0.26.4"
webpki-roots = "0.26"

[dev-dependencies]
divan = "0.1"

[[bin]]
name = "profile"
path = "src/bin/profile.rs"

[[bench]]
name = "end-to-end"
harness = false
